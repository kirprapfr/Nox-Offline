<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nox Manga Reader</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', system-ui, sans-serif;
            }
            body {
                background: #0c101a;
                color: #f1f5f9;
                display: flex;
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }
            .toolbar {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                background: linear-gradient(90deg, #13192b, #181f33);
                padding: 12px 16px;
                border-bottom: 1px solid rgba(148, 163, 184, 0.14);
                align-items: center;
            }
            button,
            .file-label {
                background: #1e263d;
                color: #f1f5f9;
                border: 1px solid rgba(148, 163, 184, 0.2);
                padding: 8px 14px;
                border-radius: 10px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
                transition: all 0.15s ease;
            }
            button:hover,
            .file-label:hover {
                border-color: #8b5cf6;
                background: linear-gradient(135deg, #7c3aed, #4f46e5);
                color: #fff;
            }
            input[type='file'] {
                display: none;
            }
            .page-info {
                margin-left: auto;
                font-size: 13px;
                color: #38bdf8;
                font-weight: 600;
            }
            .reader-area {
                flex: 1;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 18px;
                gap: 8px;
            }
            .reader-area img {
                max-width: 850px;
                width: 100%;
                height: auto;
                border-radius: 6px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            }
            .placeholder {
                color: #94a3b8;
                margin-top: 90px;
                font-size: 14px;
                text-align: center;
                line-height: 1.7;
                background: #13192b;
                padding: 24px 32px;
                border-radius: 16px;
                border: 1px solid rgba(139, 92, 246, 0.28);
            }
        </style>
    </head>
    <body>
        <div class="toolbar">
            <label class="file-label">
                Select Chapter Folder
                <input type="file" id="folderInput" webkitdirectory multiple accept="image/*" />
            </label>
            <label class="file-label">
                Select Image Files
                <input type="file" id="filesInput" multiple accept="image/*" />
            </label>
            <button onclick="toggleMode()" id="modeBtn">Mode: Vertical Scroll</button>
            <button onclick="adjustZoom(-100)">Zoom −</button>
            <button onclick="adjustZoom(100)">Zoom +</button>
            <button onclick="changePage(-1)" id="prevBtn" style="display: none">← Prev</button>
            <button onclick="changePage(1)" id="nextBtn" style="display: none">Next →</button>
            <span class="page-info" id="pageInfo">No chapter loaded</span>
        </div>

        <div class="reader-area" id="readerArea">
            <div class="placeholder">
                Click <strong>Select Chapter Folder</strong> or <strong>Select Image Files</strong> above to load local
                manga/comic pages.<br />
                Use <strong>Left / Right arrow keys</strong> in Single Page mode.
            </div>
        </div>

        <script>
            let pages = [];
            let currentIndex = 0;
            let singlePageMode = false;
            let maxPageWidth = 850;

            const readerArea = document.getElementById('readerArea');
            const pageInfo = document.getElementById('pageInfo');
            const modeBtn = document.getElementById('modeBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            function handleFiles(fileList) {
                const imgs = Array.from(fileList)
                    .filter((f) => f.type.startsWith('image/'))
                    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
                if (!imgs.length) return;
                pages.forEach((url) => URL.revokeObjectURL(url));
                pages = imgs.map((f) => URL.createObjectURL(f));
                currentIndex = 0;
                render();
            }

            document.getElementById('folderInput').addEventListener('change', (e) => handleFiles(e.target.files));
            document.getElementById('filesInput').addEventListener('change', (e) => handleFiles(e.target.files));

            function toggleMode() {
                singlePageMode = !singlePageMode;
                modeBtn.innerText = singlePageMode ? 'Mode: Single Page' : 'Mode: Vertical Scroll';
                prevBtn.style.display = singlePageMode ? 'inline-block' : 'none';
                nextBtn.style.display = singlePageMode ? 'inline-block' : 'none';
                render();
            }

            function adjustZoom(delta) {
                maxPageWidth = Math.max(450, Math.min(1400, maxPageWidth + delta));
                document.querySelectorAll('#readerArea img').forEach((img) => {
                    img.style.maxWidth = maxPageWidth + 'px';
                });
            }

            function changePage(delta) {
                if (!pages.length) return;
                currentIndex = Math.max(0, Math.min(pages.length - 1, currentIndex + delta));
                render();
            }

            function render() {
                if (!pages.length) return;
                readerArea.innerHTML = '';
                readerArea.scrollTop = 0;

                if (singlePageMode) {
                    const img = document.createElement('img');
                    img.src = pages[currentIndex];
                    img.style.maxWidth = maxPageWidth + 'px';
                    readerArea.appendChild(img);
                    pageInfo.innerText = `Page ${currentIndex + 1} / ${pages.length}`;
                } else {
                    pages.forEach((src) => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.style.maxWidth = maxPageWidth + 'px';
                        img.loading = 'lazy';
                        readerArea.appendChild(img);
                    });
                    pageInfo.innerText = `${pages.length} pages loaded`;
                }
            }

            document.addEventListener('keydown', (e) => {
                if (!singlePageMode) return;
                if (e.key === 'ArrowRight') changePage(1);
                if (e.key === 'ArrowLeft') changePage(-1);
            });
        </script>
    </body>
</html>
